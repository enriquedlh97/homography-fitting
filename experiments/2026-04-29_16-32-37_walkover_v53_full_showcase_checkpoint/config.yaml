pipeline:
  mode: video_hybrid
  segmenter:
    type: sam2_image
    checkpoint: sam2/checkpoints/sam2.1_hiera_tiny.pt
    model_cfg: configs/sam2.1/sam2.1_hiera_t.yaml
  fitter:
    type: hull
  compositor:
    type: inpaint
    params:
      padding: 0.1
      lum_strength: 0.0
      shade_blend: false
      inpaint_method: median_fill
      mask_dilate_px: 20
      alpha_feather_px: 1
      quad_pad_px: 20
      local_color_match: true
      blend_mode: led
    surface_overrides: {}
  tracking:
    corner_source: bbox
  camera:
    focal_length: null
input:
  video: experiments/2026-04-29_15-08-41_walkover_v52_checkpoint/outputs/composited.mp4
  logo: data/logos/redbull_court_banner_v2.png
