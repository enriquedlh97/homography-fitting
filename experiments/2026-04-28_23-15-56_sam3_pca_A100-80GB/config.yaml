pipeline:
  mode: video
  segmenter:
    type: sam3_video
  fitter:
    type: pca
    params:
      axis: short
  compositor:
    type: alpha
    params:
      padding: 0.05
  camera:
    focal_length: null
  stabilization:
    enabled: true
    mode: hybrid
    static_motion_threshold_px: 0.75
    hold_corner_rms_px: 1.25
    mask_iou_gate: 0.55
    max_hold_frames: 6
    predicted_mask_weight: 0.65
    morph_kernel_px: 3
input:
  video: data/tennis-clip.mp4
  logo: data/logos/gemini-logo.png
  prompts:
  - obj_id: 1
    text: logo
output:
  dir: experiments/
