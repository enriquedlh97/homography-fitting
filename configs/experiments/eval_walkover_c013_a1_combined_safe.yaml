pipeline:
  mode: video_hybrid
  segmenter:
    type: sam2_image
    checkpoint: sam2/checkpoints/sam2.1_hiera_tiny.pt
    model_cfg: configs/sam2.1/sam2.1_hiera_t.yaml
  fitter:
    type: hull
  compositor:
    type: inpaint
    params:
      padding: 0.1
      lum_strength: 0.0
      shade_blend: false
      inpaint_method: median_fill
      mask_dilate_px: 10
      alpha_feather_px: 1
      quad_pad_px: 20
      local_color_match: true
      blend_mode: led
      erase_only: false
    surface_overrides:
      court_floor:
        padding: 0.0
        alpha_scale: 1.0
        alpha_feather_px: 25
        erase_text: false
        erase_only: false
        shade_strength: 0.0
        quad_expand_px: 80
        occlusion_dilate_px: 2
        logo_blur_px: 1
  occlusion_masker:
    type: matanyone2
    confidence_threshold: 0.5
    mask_smooth: true
    mask_close_px: 5
    mask_dilate_px: 2
  tracking:
    corner_source: bbox
  camera:
    focal_length: null
