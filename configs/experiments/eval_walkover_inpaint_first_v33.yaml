pipeline:
  mode: video_hybrid
  segmenter:
    type: sam2_image
    checkpoint: sam2/checkpoints/sam2.1_hiera_tiny.pt
    model_cfg: configs/sam2.1/sam2.1_hiera_t.yaml
  fitter:
    type: hull
  compositor:
    type: inpaint
    params:
      padding: 0.1
      lum_strength: 0.0
      shade_blend: false
      inpaint_method: median_fill
      mask_dilate_px: 20
      alpha_feather_px: 1
      quad_pad_px: 20
      local_color_match: true
      blend_mode: led
      erase_only: true
    surface_overrides:
      court_floor:
        padding: 0.0
        alpha_scale: 1.0
        alpha_feather_px: 25
        erase_text: false
        erase_only: false
        shade_strength: 0.0
        quad_expand_px: 80
        occlusion_dilate_px: 2
      side_panel:
        inpaint_method: ns
        inpaint_radius: 3
        mask_dilate_px: 10
        inpaint_feather_px: 5
        local_color_match: false
        lum_strength: 0.0
  # MatAnyone produces continuous (soft) alpha matting — pixels at the
  # player edge get 0.3-0.7 alpha instead of the binary 0/1 from SAM2.
  # This lets the composite blend motion-blurred edges smoothly into the
  # background, eliminating the ghost-leg/halo artifacts that come from
  # binary masks failing to capture motion blur.
  occlusion_masker:
    type: matanyone
    confidence_threshold: 0.5
    mask_smooth: true
    mask_close_px: 5
    mask_dilate_px: 2
  tracking:
    corner_source: bbox
  camera:
    focal_length: null
input:
  video: data/melbourne-walking-over-logo.mov
  clean_video: data/clean_court_de_35px.mp4
  clean_video_quad: [[649, 840], [1268, 840], [1268, 1038], [649, 1038]]
  clean_video_dilate_px: 25
  clean_video_core_dilate_px: 3
  clean_video_feather_px: 20
  clean_video_quad_feather_px: 60
  clean_video_temporal_window: 0
  clean_video_lumin_match: true
  clean_video_lumin_blur_px: 51
  clean_video_text_cleanup: true
  clean_video_text_threshold: 130
  clean_video_post_blend_cleanup: true
  clean_video_post_blend_threshold: 130
  clean_video_post_blend_alpha: 0.3
  clean_video_post_blend_blur_px: 15
  logo: data/logos/redbull_white.png
  prompts:
  - obj_id: 1
    points:
    - - 537
      - 47
    - - 572
      - 34
    - - 599
      - 33
    labels: [1, 1, 1]
    box: [519, 22, 615, 56]
  - obj_id: 2
    points:
    - - 1122
      - 37
    labels: [1]
    box: [1109, 26, 1136, 50]
  - obj_id: 3
    surface_type: court_floor
    points:
    - - 758
      - 939
    - - 957
      - 939
    - - 1117
      - 939
    labels: [1, 1, 1]
    box: [729, 920, 1188, 958]
  - obj_id: 4
    surface_type: court_floor
    points:
